<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Productos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🛒 Gestor de Productos</h1>
    <p>Agrega y visualiza tus productos fácilmente</p>
  </header>

  <main>
    
    <section class="form-section">
      <h2>Agregar Producto</h2>
      <form id="productForm" novalidate>

        <div class="form-group">
          <label for="nombre">Nombre del producto <span class="required">*</span></label>
          <input
            type="text"
            id="nombre"
            placeholder="Ej. Laptop Dell XPS 15"
            maxlength="80"
            autocomplete="off"
          />
          <span class="error-msg" id="errorNombre"></span>
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción <span class="required">*</span></label>
          <textarea
            id="descripcion"
            placeholder="Describe el producto brevemente..."
            rows="4"
            maxlength="300"
          ></textarea>
          <span class="char-count" id="charCount">0 / 300</span>
          <span class="error-msg" id="errorDescripcion"></span>
        </div>

        <div class="form-group">
          <label for="imagen">Imagen del producto</label>
          <div class="upload-area" id="uploadArea">
            <input type="file" id="imagen" accept="image/*" />
            <div class="upload-placeholder" id="uploadPlaceholder">
              <span class="upload-icon">📷</span>
              <p>Haz clic o arrastra una imagen aquí</p>
              <small>JPG, PNG, WEBP, GIF (máx. 5 MB)</small>
            </div>
            <img id="preview" src="" alt="Vista previa" />
          </div>
          <span class="error-msg" id="errorImagen"></span>
        </div>

        <div class="form-actions">
          <button type="submit" id="btnAgregar">
            <span class="btn-icon">＋</span> Agregar Producto
          </button>
          <button type="button" id="btnLimpiar">🗑 Limpiar</button>
        </div>

      </form>
    </section>

   
    <section class="products-section">
      <div class="products-header">
        <h2>Productos Registrados</h2>
        <span class="badge" id="productCount">0 productos</span>
      </div>

      <div id="emptyState" class="empty-state">
        <span class="empty-icon">📦</span>
        <p>Aún no hay productos. ¡Agrega el primero!</p>
      </div>

      <div id="productContainer" class="product-grid"></div>
    </section>
  </main>

  
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
